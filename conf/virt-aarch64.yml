header:
  version: 14
  includes:
    - conf/includes/base.yml

machine: virt-aarch64

target:
  - secure-image-minimal
  - secure-update-bundle

repos:
  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    path: layers/meta-openembedded
    layers:
      meta-oe:
      meta-perl:

  meta-security:
    url: https://git.yoctoproject.org/meta-security
    path: layers/meta-security
    
  meta-secure-core:
    url: https://github.com/Wind-River/meta-secure-core.git
    path: layers/meta-secure-core
    layers:
      meta-secure-core-common:
      meta-signing-key:
      meta-efi-secure-boot:

  meta-arm:
    url: "https://github.com/jonmason/meta-arm"
    branch: master
    path: layers/meta-arm
    layers:
      meta-arm:
      meta-arm-toolchain:

local_conf_header:
  secure-boot: |
    FIRMWARE_BINARY = "flash-${MACHINE}-${RELEASE_TYPE}.bin"
    EFI_SYSTEM_PARTITION_IMAGE = "efi-system-partition-image-${MACHINE}-${RELEASE_TYPE}.wic.qcow2"

    # For now, keys are created in the build directory - a productive setup would require
    # proper key provisioning and infrastructure.
    SBSIGN_KEYS_DIR = "${TOPDIR}/sbsign"

    DISTRO_FEATURES:append = " security "
    IMAGE_CLASSES += "dm-verity-img"
    DM_VERITY_IMAGE = "secure-image-minimal"
    DM_VERITY_IMAGE_TYPE = "squashfs"